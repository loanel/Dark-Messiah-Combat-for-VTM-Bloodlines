; DMCombat settings. Saved changes apply live while the game runs (checked every 0.5 s).
[viewmodel]
enabled=1        ; 1 = Dark Messiah sword motion on the first-person katana
debug=1          ; 1 = log every move change to dmcombat.log
grip=-13        ; where the hand holds the katana, along the katana's length (model units, centre = 0)
flip=0           ; 1 = turn the katana end-over-end (if the blade points backwards)
roll=0           ; spin the blade about its length, degrees (if the edge doesn't lead the swing)
offset_x=16      ; move the sword forward (+) / back (-)
offset_y=-2      ; left (+) / right (-)
offset_z=-20     ; up (+) / down (-)
pitch=0          ; tilt the whole sword motion down (+) or up (-), degrees
viewmodel_fov=54 ; viewmodel field of view while the katana is drawn (0 = leave the game setting alone); restored for other weapons
speed=1.0        ; animation playback speed
charge_time=0.36 ; how long to hold attack before a power attack starts (DM: 0.36 s)
blend=0.12       ; crossfade between moves, seconds
hits=1           ; 1 = the katana hits with the DM sword (no Bloodlines swing or lunge), 0 = Bloodlines attack
damage_scale=1.0 ; extra multiplier on all katana damage (fast attack = 0.75x, power attack = 2.5x Bloodlines damage)
side_knock=1      ; left/right power attacks stagger enemies sideways: 1 = normal, 2 = big, 0 = off (straight back)
side_knock_flip=0 ; 1 = swap the sideways direction
parry_window=0.3 ; a block within this many seconds of raising the guard is a perfect parry (free, big stagger)
parry_blood=1    ; blood points a mistimed block costs (0 = free); with no blood the hit is only softened
reach_fast=10     ; extra hit reach past the visible blade tip, fast attacks (units; tip itself reaches ~65-71)
reach_power=20    ; extra reach, power slashes (tip ~69-71)
reach_stab=30     ; extra reach, power stabs: forward/back power attacks (tip ~78-79)
reach_impale=50   ; extra reach, impale (forward/back adrenaline move) - the longest of all
adrenaline_base=20      ; adrenaline needed for an adrenaline move with Melee 0 (Dark Messiah: 20)
adrenaline_per_melee=2  ; each point of Melee lowers the requirement by this much (Melee 5 -> 10)
adrenaline_min=8        ; the requirement never drops below this
adrenaline_gain=1       ; multiplier on adrenaline per hit (fast 0.5, power 3, right-hand power 1)
adrenaline_decay=20     ; seconds per point of adrenaline lost (0 = never)
finisher_range=110      ; enemy centre within this range in front turns the adrenaline move into a fatality (110 = power slash reach)
hud=1                   ; 1 = adrenaline bar left of the blood bar
hud_offset=0.28         ; how far left of the blood bar, in blood-frame widths
hud_scale=0.65          ; adrenaline bar size relative to the blood bar
adrenaline_volume=0.8   ; volume of the "adrenaline full" sound (Dark Messiah used 0.6; 0 = off)
impale_hold=0.6         ; seconds the impale (stab adrenaline move) keeps the blade in before pulling out
trail=1                 ; 1 = red streak behind the adrenaline moves (shows their real reach: blade middle -> tip + extra reach)
trail_life=0.2          ; seconds the streak lingers
trail_alpha=170         ; streak opacity (0-255)
torch_flame=4           ; torch: the flame burns this many units below the head end of the drawn torch
adrenaline_reticle=1    ; 1 = the crosshair gets a red pulsing ring while adrenaline is full
adrenaline_reticle_size=40 ; size of that ring (768-line units)
adrenaline_edges=1      ; 1 = the screen sides pulse red while adrenaline is full (Dark Messiah style)
exit_watchdog=0   ; 1 = end the game process if it is still running 5 s after its window closed (only if the game hangs on quit)
